name: Publish wheels

# Publishes supacrawl's wheel to the household PRIVATE devpi index (poodle64/prod
# on atlas), so cross-repo household consumers resolve `supacrawl` as an ordinary
# version spec from the index instead of an editable sibling checkout. This is a
# SEPARATE channel from public PyPI: publish.yaml publishes tagged releases to
# public PyPI for `pip install supacrawl`; this file keeps the private index
# carrying always-current code for household consumers.
#
# It also hardens the index against dependency confusion. poodle64/prod bases on a
# PyPI mirror, so with nothing uploaded here the index resolves `supacrawl` via the
# mirror — today that is poodle64's own public release, but a private name resolving
# through a public mirror is the shadowing vector core/supply-chain.md forbids (a
# higher public version, or loss of the PyPI name, would be served in our place).
# Uploading our wheel to poodle64/prod shadows the mirror and closes that vector
# (master-project#275).
#
# INLINED, NOT a thin caller of master-project's publish-wheels.yaml reusable, for
# one hard reason: supacrawl is a PUBLIC repo and radar-hooves/master-project is
# PRIVATE. GitHub blocks a public repo from resolving a reusable workflow (or a
# referenced action) in a private one — the call dies at startup validation with
# zero jobs. The sibling libraries (redactyl, ragify, core-memory — all private)
# CAN call it; supacrawl cannot. This is the same constraint that keeps ntfy-failure
# and the security scan inlined here (ci.yaml, security.yaml) and the auto-label
# caller omitted (.claude/CLAUDE.md §CI deviations). So this file mirrors the
# reusable's logic: build-time version stamp, wheel-only build, devpi upload reading
# the password from a runner-host file, 409-treated-as-skip idempotency. The only
# deltas forced by the public-repo constraint are the public astral-sh/setup-uv
# action (in place of master-project's setup-uv composite) and, as a single-package
# repo, a plain `uv build --wheel` in place of the reusable's workspace
# `--all-packages`. Keep the rest aligned with
# radar-hooves/master-project/.github/workflows/publish-wheels.yaml.
#
# The credential is NOT a GitHub secret. The devpi upload password is read from a
# file on the atlas runner host (/var/lib/devpi-ci/upload_password, mode 0400,
# runner-owned), minted there by the devpi-credentials systemd oneshot — fleet/ci.md
# requires a household artefact-store credential to reach CI from the runner host,
# never through GitHub (master-project#275). devpi and the runner share a host, so
# the value never transits GitHub. A credential failure here is an atlas host
# problem to diagnose, NOT a reason to add a GitHub secret.
#
# stamp-version behaviour is deliberate. devpi is non-volatile and skips an upload
# whose version already EXISTS (on existence, not content), so an unstamped repo
# would freeze at its first upload and no later source change would reach the index.
# supacrawl[mcp] is consumed cross-repo, so each publish stamps an always-increasing
# build version onto the wheel while the source `version` stays the public-release
# floor (still used by publish.yaml for tagged PyPI releases) — a household consumer
# always resolves current code with no hand-bumping.
# Rule: platform/common-libraries.md §Distribution.
#
# The stamp is the household's three-segment CalVer, `YYYY.M.<counter>`
# (core/git-workflow.md §Calendar Versioning). Until 2026-08-27 it was
# `YYYY.M.<day>.<run>` here and in the reusable — four segments whose third was the
# day of the month, which READ as household CalVer and was not, and cost a session
# that called `ragify 2026.8.4` a regression against a deployed `2026.8.26.27`.
# RUN_OFFSET and the `Refuse a non-CalVer wheel version` step below mirror the
# reusable's; keep all three aligned with
# radar-hooves/master-project/.github/workflows/publish-wheels.yaml.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/publish-wheels.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, atlas]
    env:
      # Internal devpi upload URL on the atlas Docker network — the same address
      # the sibling repos' publish-wheels callers use. External read ingress is
      # https://pypi.godswood.au/poodle64/prod/ (used by the verify step below).
      INDEX_URL: http://172.21.0.2:3141/poodle64/prod/
      UPLOAD_PASSWORD_FILE: /var/lib/devpi-ci/upload_password
      DEVPI_USER: poodle64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (and Python 3.14)
        # Public action (not master-project's setup-uv composite): a public repo
        # cannot resolve an action in the private master-project. Mirrors ci.yaml.
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: '3.14'

      - name: Stamp always-increasing wheel version
        # The source `version` stays a frozen floor (no hand-bumping); each publish
        # stamps YYYY.M.<counter> so a consumer's index resolution always gets
        # current code. Runs only on the CI build checkout; never committed back.
        #
        # Brisbane, not UTC: §Calendar Versioning reads the year and month in AEST,
        # and a UTC clock disagrees with it for the first ten hours of every AEST day.
        #
        # RUN_OFFSET is one-time and then never touched again. Measured against the
        # index on 2026-08-27: supacrawl's published maximum is 2026.8.25.13 from the
        # old four-part scheme, while this workflow's run counter was only at 13. A
        # bare run number would stamp 2026.8.14 — BELOW what the index already serves
        # — so every consumer pinned `supacrawl>=<floor>` would go on resolving the
        # older, higher 2026.8.25.13 and silently freeze on stale code. +20 clears 25
        # with room to spare, and stops mattering at the September rollover, when
        # 2026.9.x sorts above every 2026.8.x whatever the counter.
        env:
          RUN_OFFSET: 20
        run: |
          set -euo pipefail
          if ! printf '%s' "${RUN_OFFSET}" | grep -qE '^[0-9]+$'; then
            echo "::error::RUN_OFFSET must be a non-negative whole number; got '${RUN_OFFSET}'."
            exit 1
          fi
          COUNTER="$(( GITHUB_RUN_NUMBER + RUN_OFFSET ))"
          STAMP="$(TZ=Australia/Brisbane date +%Y.%-m).${COUNTER}"
          echo "STAMP=${STAMP}" >> "${GITHUB_ENV}"
          echo "Stamping wheel version -> ${STAMP}"
          find . -name pyproject.toml -not -path './.git/*' -not -path './.venv/*' -print0 \
            | while IFS= read -r -d '' f; do
                if grep -qE '^version = "' "${f}"; then
                  sed -i -E "s/^version = \".*\"/version = \"${STAMP}\"/" "${f}"
                  echo "  stamped: ${f}"
                fi
              done

      - name: Build wheel
        # --wheel (no sdist): the index serves wheels to consumers, and a sdist
        # round-trip can fail on the dev-only external path sources this repo carries.
        run: |
          rm -rf dist
          uv build --wheel --out-dir dist
          ls -1 dist

      - name: Refuse a non-CalVer wheel version
        # THE GATE, mirroring the reusable's step of the same name. A wheel version
        # that is not household CalVer never reaches the index — it fails here, red
        # and named, instead of publishing something that merely LOOKS like the
        # format. This exists because the previous stamp, `YYYY.M.<day>.<run>`,
        # passed every other check in this file for months.
        #
        # It asserts against the BUILT WHEEL, not the stamp variable, so it also
        # catches the stamp silently not landing: if the sed matches no
        # pyproject.toml the wheel carries the frozen source floor and this says so.
        #
        # What it does NOT catch, stated plainly rather than implied:
        #   - a stamp that is well-formed but sorts BELOW what the index already
        #     holds. Ordering is a property of the counter, not the shape.
        #   - divergence from the reusable it is a copy of; nothing mechanical
        #     compares the two files (see the header note).
        #   - the AEST-vs-UTC clock: a regex cannot see which timezone produced the
        #     month segment.
        env:
          EXPECTED: ${{ env.STAMP }}
        run: |
          set -euo pipefail
          # YYYY.M.counter — four-digit year, UNPADDED month 1-12, numeric counter.
          # Deliberately rejects a fourth segment (the old day-of-month stamp), a
          # zero-padded month, and anything non-numeric.
          CALVER='^[0-9]{4}\.([1-9]|1[0-2])\.[0-9]+$'

          if [ -z "${EXPECTED:-}" ]; then
            echo "::error::no stamp was recorded — the stamping step did not run or did not export STAMP. Refusing to publish."
            exit 1
          fi
          if ! printf '%s' "${EXPECTED}" | grep -qE "${CALVER}"; then
            echo "::error::stamp '${EXPECTED}' is not household CalVer YYYY.M.x (core/git-workflow.md §Calendar Versioning). A four-segment stamp such as 2026.8.25.13 reads as this format and is not it. Refusing to publish."
            exit 1
          fi

          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "::error::no wheels were built; nothing to verify or publish."
            exit 1
          fi

          bad=0
          for w in "${wheels[@]}"; do
            # {name}-{version}-{python}-{abi}-{platform}.whl; the distribution name
            # has its hyphens normalised to underscores, so field 2 is the version.
            v="$(basename "${w}" | cut -d- -f2)"
            if [ "${v}" != "${EXPECTED}" ]; then
              echo "::error::${w##*/} carries version '${v}', not the stamp '${EXPECTED}'. The stamp did not reach this package's pyproject.toml."
              bad=1
            fi
          done
          if [ "${bad}" -ne 0 ]; then
            echo "::error::refusing to publish: at least one wheel does not carry the CalVer stamp."
            exit 1
          fi
          echo "verified: ${#wheels[@]} wheels all carry the household CalVer stamp ${EXPECTED}"

      - name: Publish to devpi (idempotent; skips versions already present)
        run: |
          # The credential is read from the runner host, never a GitHub secret
          # (fleet/ci.md) — devpi and this runner share a host. Read straight into
          # the env twine consumes so it never lands in a variable that could echo.
          if [ ! -r "${UPLOAD_PASSWORD_FILE}" ]; then
            echo "::error::devpi upload password file ${UPLOAD_PASSWORD_FILE} is missing or unreadable by the runner. It is minted by the devpi-credentials systemd unit on the atlas host; check that unit rather than adding a GitHub secret."
            exit 1
          fi
          export TWINE_USERNAME="${DEVPI_USER}"
          export TWINE_PASSWORD
          TWINE_PASSWORD="$(cat "${UPLOAD_PASSWORD_FILE}")"
          # Modern hatchling emits Metadata-Version 2.5, which twine<6.2 rejects.
          # twine 6.2 made --skip-existing PyPI-only, so devpi idempotency is done
          # here: upload each wheel and treat devpi's 409 "already exists" as a skip.
          rc=0
          for f in dist/*; do
            if out="$(uvx --from 'twine>=6.2' twine upload \
                        --repository-url "${INDEX_URL}" \
                        --non-interactive "${f}" 2>&1)"; then
              printf '%s\n' "${out}"
            elif printf '%s' "${out}" | grep -qiE '409|conflict|already (exists|been uploaded|uploaded)'; then
              echo "skip existing (already on index): ${f}"
            else
              printf '%s\n' "${out}"
              rc=1
            fi
          done
          exit "${rc}"

      - name: Verify the index serves our wheel (not the PyPI mirror)
        # A green build is not evidence the artefact is consumable (core/verification.md).
        # Query the index and assert a file link under poodle64/prod/+f/ — a locally
        # uploaded release. A MIRROR-ONLY package has no such link (its files sit
        # under the mirror), which is exactly the shadowing vector this closes.
        run: |
          NETRC="$(mktemp)"
          chmod 600 "${NETRC}"
          # Write the credential straight into the file curl consumes; never echo it.
          { printf 'machine 172.21.0.2 login %s password ' "${DEVPI_USER}"; cat "${UPLOAD_PASSWORD_FILE}"; echo; } > "${NETRC}"
          ok=0
          for attempt in 1 2 3; do
            resp="$(curl -s --netrc-file "${NETRC}" -H 'Accept: application/json' "${INDEX_URL}supacrawl" || true)"
            if printf '%s' "${resp}" | grep -q '/poodle64/prod/+f/'; then
              ok=1
              break
            fi
            echo "attempt ${attempt}: no local +f/ link yet; retrying"
            sleep 3
          done
          rm -f "${NETRC}"
          if [ "${ok}" -ne 1 ]; then
            echo "::error::supacrawl is NOT served locally from poodle64/prod — no +f/ file link found. The index is serving the PyPI mirror instead of our wheel. Upload did not land."
            printf '%s\n' "${resp}" | head -c 2000
            exit 1
          fi
          echo "verified: supacrawl served locally from poodle64/prod (shadows the PyPI mirror)"
          printf '%s' "${resp}" | grep -oE 'https?://[^"]*poodle64/prod/\+f/[^"]*\.whl' | sort -u | head

      - name: Notify failure (ntfy infra)
        # ntfy-failure inlined: supacrawl is a public repo; GitHub blocks public
        # repos from referencing actions in private repos (radar-hooves/master-project).
        # Logic mirrors radar-hooves/master-project/.github/actions/ntfy-failure@main.
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          NTFY_TITLE: 'supacrawl: wheel publish failed'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TOKEN=""
          for f in /etc/ntfy/tokens/ci-publisher.token /run/secrets/ntfy/systemd; do
            [ -n "$TOKEN" ] && break
            [ -r "$f" ] && TOKEN="$(cat "$f")"
          done
          if [ -z "$TOKEN" ]; then
            echo "::warning::ntfy-failure: no token available — failure notification NOT sent"
            exit 0
          fi
          curl -sS --max-time 10 \
            -H "Authorization: Bearer $TOKEN" \
            -H "Title: $NTFY_TITLE" \
            -H "Priority: 4" \
            -H "Tags: rotating_light" \
            -d "Run: $RUN_URL" \
            "https://ntfy.godswood.au/infra" \
            || echo "::warning::ntfy-failure: notification POST failed"
