name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: [self-hosted, atlas]
    env:
      # Install from the committed lock; never re-resolve in CI (10-ci-workflow-standard).
      UV_FROZEN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (and Python 3.14)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: '3.14'
          enable-cache: true

      # --no-group mcp-dev: the mcp-dev/mcp-common-dev groups carry
      # supacrawl[mcp] plus editable path sources into the mcp-servers and
      # api-clients siblings, which do not exist on a bare runner checkout.
      # Ruff is a pure static-AST linter — it needs no packages importable —
      # so this only trims what gets installed, not what gets linted.
      - name: Install dependencies
        run: uv sync --no-group mcp-dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      # ntfy-failure inlined: supacrawl is a public repo; GitHub blocks public
      # repos from referencing actions in private repos (radar-hooves/master-project).
      # Logic mirrors radar-hooves/master-project/.github/actions/ntfy-failure@main.
      - name: Notify failure (ntfy infra)
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          NTFY_TITLE: 'supacrawl: lint failed'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TOKEN=""
          for f in /etc/ntfy/tokens/ci-publisher.token /run/secrets/ntfy/systemd; do
            [ -n "$TOKEN" ] && break
            [ -r "$f" ] && TOKEN="$(cat "$f")"
          done
          if [ -z "$TOKEN" ]; then
            echo "::warning::ntfy-failure: no token available — failure notification NOT sent"
            exit 0
          fi
          curl -sS --max-time 10 \
            -H "Authorization: Bearer $TOKEN" \
            -H "Title: $NTFY_TITLE" \
            -H "Priority: 4" \
            -H "Tags: rotating_light" \
            -d "Run: $RUN_URL" \
            "https://ntfy.godswood.au/infra" \
            || echo "::warning::ntfy-failure: notification POST failed"

  typecheck:
    runs-on: [self-hosted, atlas]
    env:
      # Install from the committed lock; never re-resolve in CI (10-ci-workflow-standard).
      UV_FROZEN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (and Python 3.14)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: '3.14'
          enable-cache: true

      # --no-group mcp-dev: see the lint job comment above. mypy is purely
      # static (never imports at runtime), so `mypy src/ tests/` still
      # analyses the MCP-surface files under a per-module
      # ignore_missing_imports override (fastmcp/mcp/mcp_common/api_common/
      # dotenv/pydantic_settings) rather than needing those packages present.
      - name: Install dependencies
        run: uv sync --no-group mcp-dev

      - name: Type check
        run: uv run mypy src/ tests/

      - name: Notify failure (ntfy infra)
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          NTFY_TITLE: 'supacrawl: typecheck failed'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TOKEN=""
          for f in /etc/ntfy/tokens/ci-publisher.token /run/secrets/ntfy/systemd; do
            [ -n "$TOKEN" ] && break
            [ -r "$f" ] && TOKEN="$(cat "$f")"
          done
          if [ -z "$TOKEN" ]; then
            echo "::warning::ntfy-failure: no token available — failure notification NOT sent"
            exit 0
          fi
          curl -sS --max-time 10 \
            -H "Authorization: Bearer $TOKEN" \
            -H "Title: $NTFY_TITLE" \
            -H "Priority: 4" \
            -H "Tags: rotating_light" \
            -d "Run: $RUN_URL" \
            "https://ntfy.godswood.au/infra" \
            || echo "::warning::ntfy-failure: notification POST failed"

  test:
    name: test
    # by-exception (2026-07-05): tests/test_browser.py drives a real headless
    # Chromium outside the e2e marker, and `playwright install --with-deps`
    # needs apt+sudo the NixOS atlas runner doesn't have (supacrawl#147). A
    # containerised self-hosted job was tried first but the atlas runner's
    # bundled github-runner package has no node24 externals, which container
    # jobs need for actions/checkout@v7 — a runner-packaging gap, not fixable
    # from this repo. Mirrors portcullis's gui-tests.yaml playwright-e2e job:
    # GitHub-hosted ubuntu-latest gives Playwright its native apt/sudo target.
    runs-on: ubuntu-latest # by-exception (2026-07-05): Playwright's `--with-deps` OS-dep install needs apt+sudo unavailable on the NixOS atlas runner, mirroring portcullis gui-tests
    env:
      # Install from the committed lock; never re-resolve in CI (10-ci-workflow-standard).
      UV_FROZEN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (and Python 3.14)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: '3.14'
          enable-cache: true

      # --no-group mcp-dev: see the lint job comment above.
      - name: Install dependencies
        run: uv sync --no-group mcp-dev

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      # Two exclusion mechanisms, for two different failure shapes once the
      # mcp-dev group is absent:
      #   --ignore  — tests/test_mcp/, tests/test_health_search_config.py,
      #               tests/test_health_search_probe.py and
      #               tests/test_provider_fallback_visibility.py import the MCP
      #               surface (fastmcp/mcp_common) at module top level, so pytest
      #               fails at COLLECTION/SETUP time before any `-m` filter can
      #               apply. --ignore excludes them from collection entirely.
      #               tests/test_api/ no longer needs this — the API router now
      #               sources its business logic from the portable
      #               supacrawl.services layer instead of supacrawl.mcp (#151).
      #   -m "not mcp" — a handful of individual test classes elsewhere
      #               (test_headless_propagation.py, test_remediation.py,
      #               test_search_quota.py) defer their supacrawl.mcp import
      #               inside the test body, so the FILE collects fine but
      #               those specific @pytest.mark.mcp classes still need
      #               excluding at run time.
      # All of the above run locally (`uv sync --all-groups` installs mcp-dev).
      #   -m "not stealth_smoke" — the #145 engine-launch smoke tests need every
      #               engine's browser binary fetched (camoufox fetch especially),
      #               which this job does not do; they run in the dedicated
      #               stealth-smoke job below.
      - name: Test
        run: uv run pytest -m "not e2e and not mcp and not stealth_smoke" --ignore=tests/test_mcp --ignore=tests/test_health_search_config.py --ignore=tests/test_health_search_probe.py --ignore=tests/test_provider_fallback_visibility.py

      # ntfy-failure inlined (public repo, see lint/typecheck jobs above); this
      # job runs on ubuntu-latest so the atlas host token files below don't
      # exist — falls through to secrets.NTFY_TOKEN, provisioned for this repo
      # (#150) so a red main run pages the infra topic.
      - name: Notify failure (ntfy infra)
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          NTFY_TITLE: 'supacrawl: test failed'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          TOKEN="$NTFY_TOKEN"
          for f in /etc/ntfy/tokens/ci-publisher.token /run/secrets/ntfy/systemd; do
            [ -n "$TOKEN" ] && break
            [ -r "$f" ] && TOKEN="$(cat "$f")"
          done
          if [ -z "$TOKEN" ]; then
            echo "::warning::ntfy-failure: no token available — failure notification NOT sent"
            exit 0
          fi
          curl -sS --max-time 10 \
            -H "Authorization: Bearer $TOKEN" \
            -H "Title: $NTFY_TITLE" \
            -H "Priority: 4" \
            -H "Tags: rotating_light" \
            -d "Run: $RUN_URL" \
            "https://ntfy.godswood.au/infra" \
            || echo "::warning::ntfy-failure: notification POST failed"

  stealth-smoke:
    name: stealth-smoke
    # #145: actually launch each stealth engine headless, so a broken stealth
    # extra (install, version skew, missing binary) fails supacrawl's own
    # pipeline instead of a downstream container build or a consumer at runtime.
    # Separate from `test` because it fetches every engine's browser binary —
    # `camoufox fetch` especially, which the main job does not run. ubuntu-latest
    # for the same reason as `test`: Playwright's `--with-deps` needs apt+sudo the
    # NixOS atlas runner does not have (supacrawl#147).
    runs-on: ubuntu-latest # by-exception (2026-09-07): Playwright --with-deps needs apt and sudo the NixOS runner lacks (#147)
    env:
      UV_FROZEN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (and Python 3.14)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: '3.14'
          enable-cache: true

      # The dev group pulls in the stealth + camoufox extras (patchright,
      # camoufox); --no-group mcp-dev keeps the unresolvable MCP slice out.
      - name: Install dependencies
        run: uv sync --no-group mcp-dev

      # Every engine's browser binary must be present for a real launch:
      #   playwright/patchright share the ms-playwright Chromium registry;
      #   camoufox fetches its own patched Firefox build.
      - name: Install engine browsers (Chromium + Camoufox)
        run: |
          uv run playwright install --with-deps chromium
          uv run patchright install --with-deps chromium
          uv run camoufox fetch

      # Target the smoke file directly: this job installs without the mcp group,
      # so collecting the whole suite would fail at import on the MCP test modules
      # (fastmcp absent) before the marker filter runs — the same reason the main
      # test job carries its own --ignore list. The marker still gates the file's
      # contents and keeps it out of the main job.
      - name: Smoke-test each stealth engine launches headless
        run: uv run pytest tests/test_engine_smoke.py -m stealth_smoke -p no:cacheprovider

      - name: Notify failure (ntfy infra)
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          NTFY_TITLE: 'supacrawl: stealth-smoke failed'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          TOKEN="$NTFY_TOKEN"
          for f in /etc/ntfy/tokens/ci-publisher.token /run/secrets/ntfy/systemd; do
            [ -n "$TOKEN" ] && break
            [ -r "$f" ] && TOKEN="$(cat "$f")"
          done
          if [ -z "$TOKEN" ]; then
            echo "::warning::ntfy-failure: no token available — failure notification NOT sent"
            exit 0
          fi
          curl -sS --max-time 10 \
            -H "Authorization: Bearer $TOKEN" \
            -H "Title: $NTFY_TITLE" \
            -H "Priority: 4" \
            -H "Tags: rotating_light" \
            -d "Run: $RUN_URL" \
            "https://ntfy.godswood.au/infra" \
            || echo "::warning::ntfy-failure: notification POST failed"
