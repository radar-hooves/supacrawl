name: Publish to PyPI

# supacrawl is a PUBLIC tool (`pip install supacrawl`), so this publishes its
# tagged release to public PyPI via OIDC trusted publishing (no API token). The
# household PRIVATE index (poodle64/prod on atlas) is a SEPARATE channel handled
# by publish-wheels.yaml — that one carries always-current stamped wheels for
# cross-repo household consumers and shadows the index's PyPI mirror. This file
# stays the public-release channel; do not fold devpi into it.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, atlas]
    environment: pypi
    permissions:
      id-token: write # OIDC trusted publishing to PyPI
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (and Python 3.14)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: '3.14'

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
