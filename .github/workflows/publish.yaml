name: Publish to PyPI

# supacrawl is a PUBLIC tool (`pip install supacrawl`), so this publishes its
# tagged release to public PyPI via OIDC trusted publishing (no API token). Wheels
# for household consumers ship from the change pipeline's own leg, never from here.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tests that drive real browsers run here, on the one path that ships to outside
  # users. The runner's Nix-provided Chromium is older than the Playwright pinned in the
  # lock, so a scratch browsers dir presents it under the revision Playwright expects;
  # Camoufox's own Firefox build fetches normally and gets its GTK libraries from Nix.
  # The private index authenticates ambiently through the runner's vended netrc.
  browser-guard:
    runs-on: [self-hosted, atlas]
    timeout-minutes: 30
    env:
      UV_FROZEN: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv (and Python 3.14)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --no-group mcp-dev

      - name: Present the Nix Chromium under Playwright's expected revision
        run: |
          nix_browsers=$(nix build --no-link --print-out-paths nixpkgs#playwright-driver.browsers)
          rev=$(uv run python -c "import json,playwright,pathlib;j=json.loads((pathlib.Path(playwright.__file__).parent/'driver/package/browsers.json').read_text());print(next(b['revision'] for b in j['browsers'] if b['name']=='chromium'))")
          scratch=$RUNNER_TEMP/browsers
          shell=$scratch/chromium_headless_shell-$rev/chrome-headless-shell-linux64
          full=$scratch/chromium-$rev/chrome-linux64
          mkdir -p "$shell" "$full"
          cp -rs "$nix_browsers"/chromium_headless_shell-*/chrome-linux/. "$shell/"
          ln -s headless_shell "$shell/chrome-headless-shell"
          cp -rs "$nix_browsers"/chromium-*/chrome-linux/. "$full/"
          echo "PLAYWRIGHT_BROWSERS_PATH=$scratch" >> "$GITHUB_ENV"

      - name: Fetch Camoufox and find its libraries in Nix
        run: |
          uv run camoufox fetch
          libs=""
          for p in gtk3 glib stdenv.cc.cc.lib dbus-glib libx11 libxcb libxt libxtst libxrender libxext libxcomposite libxdamage libxfixes libxrandr libxi libxcursor alsa-lib pango cairo gdk-pixbuf atk fontconfig freetype libGL nspr nss; do
            out=$(nix eval --raw "nixpkgs#$p.out.outPath") && libs="$libs:$out/lib"
          done
          echo "CAMOUFOX_LIBS=${libs#:}" >> "$GITHUB_ENV"

      - name: DIAG
        run: |
          cat > $RUNNER_TEMP/d.py <<'PY'
          import asyncio, sys
          from playwright.async_api import async_playwright
          async def m(args):
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True, args=args)
                  pg=await b.new_page(); await pg.goto('about:blank'); print('OK', args); await b.close()
          try: asyncio.run(m(sys.argv[1:]))
          except Exception as e: print('FAIL', sys.argv[1:], str(e)[:80])
          PY
          DEBUG=pw:browser uv run python $RUNNER_TEMP/d.py 2>&1 | grep -E "err\]|OK|FAIL" | head -12 | cut -c1-260
          for a in --disable-gpu --disable-gpu-sandbox "--disable-gpu --in-process-gpu" --single-process; do uv run python $RUNNER_TEMP/d.py $a 2>&1 | tail -1; done || true

      # Nix's libraries on LD_LIBRARY_PATH crash the Chromium engines, so only Camoufox gets them.
      - name: Chromium engine tests
        run: uv run pytest -m "browser or stealth_smoke" -p no:cacheprovider -k "not camoufox" tests/test_browser.py tests/test_browser_recovery.py tests/test_engine_smoke.py

      - name: Camoufox engine test
        run: LD_LIBRARY_PATH=$CAMOUFOX_LIBS uv run pytest -m stealth_smoke -p no:cacheprovider -k camoufox tests/test_engine_smoke.py

  publish:
    needs: browser-guard
    # A dispatch from a branch proves the guard and publishes nothing.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, atlas]
    environment: pypi
    permissions:
      id-token: write # OIDC trusted publishing to PyPI
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv (and Python 3.14)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: '3.14'

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
