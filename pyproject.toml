 [build-system]
 requires = ["hatchling"]
 build-backend = "hatchling.build"

[project]
name = "supacrawl"
version = "2026.7.0"
 description = "Zero-infrastructure CLI web scraper with LLM extraction."
 readme = "README.md"
 requires-python = ">=3.14"
 license = { text = "MIT" }
authors = [
    {name = "poodle64"}
]
keywords = ["scraper", "crawler", "web", "llm", "markdown", "playwright"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aiofiles>=25.1.0",
  # The household telemetry contract (platform/telemetry.md): the one
  # api_common.telemetry.configure() call every entry point makes at process
  # start. redactyl-core arrives transitively (api-common depends on it), but
  # under the explicit godswood index below a [tool.uv.sources] pin only
  # reaches a declared dependency — a transitive-only name resolves against
  # PyPI and is not found. Declaring it here makes its index pin apply
  # (mirrors radar-hooves/cadmus's backend/pyproject.toml); api-common, the
  # telemetry extra, takes the same index pin.
  "redactyl-core>=2026.7.0",
  "beautifulsoup4>=4.14.3",
  "click>=8.3.1",
  "httpx[brotli]>=0.28.1",
  "markdownify>=1.2.2",
  "ollama>=0.6.1",
  "pdfplumber>=0.11.9",
  "playwright>=1.40.0,<2.0.0",  # Keep >=1.40.0 for NixOS — see #79, #104
  "pydantic>=2.12.5",
  "pyyaml>=6.0.3",
  "rich>=14.3.3",
  "tomli-w>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/radar-hooves/supacrawl"
Repository = "https://github.com/radar-hooves/supacrawl"

[dependency-groups]
# Local-path override for mcp-common, kept as its own group so its
# uv.sources entry below can be group-scoped (PEP 735). A group-scoped source
# is local-only config that a consumer resolving `supacrawl[mcp]` as a path
# dependency never sees, avoiding uv "conflicting URLs" resolution errors in
# consuming workspaces (see ragify#179 for the failure this prevents).
# api-common and redactyl-core are base dependencies now (see
# [tool.uv.sources] below for each one's source), so neither needs a group
# entry of its own.
mcp-common-dev = [
  "mcp-common",
]
# MCP surface deps, separated from dev so CI (no sibling checkouts) can
# exclude exactly this slice and still lint/type/test everything else.
mcp-dev = [
  "supacrawl[mcp]",
  {include-group = "mcp-common-dev"},
]
dev = [
  "supacrawl[stealth,camoufox,captcha,pdf-ocr,api,readability]",
  "mypy>=1.19.1",
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.15.4",
  "types-aiofiles>=25.1.0.20251011",
  "types-PyYAML>=6.0.12.20250915",
]

[project.optional-dependencies]
telemetry = [
  # The household telemetry contract (platform/telemetry.md): the one
  # api_common.telemetry.configure() call. api-common is private-index only,
  # so it is an extra: `supacrawl[telemetry]` inside the household, and a plain
  # PyPI install leaves logging to the standard library.
  "api-common[telemetry]>=2026.9.3",
]
stealth = [
  "patchright>=1.40.0",  # Keep >=1.40.0 for NixOS — see #79, #104
]
camoufox = [
  "camoufox[geoip]>=0.4.11",
  # camoufox's bundled Firefox juggler rejects playwright >= 1.61's
  # Browser.setDefaultViewport `isMobile` property ("not described in this
  # scheme"), so any camoufox launch fails at new_page. Lift the ceiling
  # once a camoufox release accepts the 1.61 protocol.
  "playwright<1.64",
]
captcha = [
  "2captcha-python>=2.0.3",
]
pdf-ocr = [
  "pytesseract>=0.3.13",
  "pdf2image>=1.17.0",
]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
]
readability = [
  "readability-lxml>=0.8",
  "rank-bm25>=0.2",
]
mcp = [
  # Shared MCP framework (BaseMCPServer, exceptions, config, logging). The MCP
  # layer consumes the real mcp_common — it does NOT vendor a copy (a vendored
  # fork silently drifts from the shared package; see the de-vendoring in this
  # repo's history). mcp-common transitively pulls api-common (correlation),
  # fastmcp, pydantic, and pydantic-settings.
  "mcp-common",
  "anyio>=4.12.1",
  "fastmcp>=3.1.0",
  "pydantic-settings>=2.13.1",
  "python-dotenv>=1.2.2",
  "starlette>=0.52.1",
]

[project.scripts]
supacrawl = "supacrawl.cli:app"
supacrawl-mcp = "supacrawl.mcp.server:main"

[tool.pytest.ini_options]
markers = [
    "unit: Pure logic tests with no I/O, network, or browser",
    "integration: Filesystem-heavy tests, may use local HTTP server and Playwright",
    "e2e: End-to-end tests with live network and Playwright",
    "mcp: MCP server tests (requires supacrawl[mcp])",
    "stealth_smoke: Launches each stealth engine headless (#145); dedicated CI job only",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:The 'text' argument to find\\(\\)-type methods is deprecated:DeprecationWarning:bs4.element",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "fpdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "twocaptcha.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "camoufox.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdfplumber.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytesseract.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdf2image.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncssh.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "readability.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rank_bm25.*"
ignore_missing_imports = true

# The MCP-surface deps are absent on CI (no sibling checkouts; see the
# mcp-dev dependency group). Locally they are installed and fully typed.
[[tool.mypy.overrides]]
module = "fastmcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp_common.*"
ignore_missing_imports = true

# api-common ships its own py.typed marker and resolves fine at runtime (it is
# a genuine editable-path sibling, see [tool.uv.sources]) but is present in
# every environment including CI (it is a base dependency now, unlike the
# mcp-surface deps above) — the sole reason it needs an override is that mypy
# cannot statically follow Hatchling's PEP 660 finder-based editable-install
# .pth (unlike mcp-common's plain directory-path .pth, which mypy resolves
# without issue) — a known mypy/Hatchling gap, not a real missing-stub problem.
[[tool.mypy.overrides]]
module = "api_common.*"
ignore_missing_imports = true

# pydantic-settings is declared only in the `mcp` extra here (unlike
# redactyl, where it is already pulled in by the always-on `api` extra) — so
# it is absent on CI for the same mcp-dev reason above. python-dotenv needs
# no override: it resolves fine on CI regardless, as a genuine transitive
# dependency of uvicorn[standard] (in the always-on `api` extra).
[[tool.mypy.overrides]]
module = "pydantic_settings.*"
ignore_missing_imports = true

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

# dev only: `uv run` performs an implicit default-groups sync wherever it
# executes, including CI runners and consumer checkouts where the editable
# mcp-dev/mcp-common-dev siblings do not exist on disk. Local dev installs
# every group via .envrc (`uv sync --all-groups`); uv run never prunes the
# extra groups it finds already installed.
default-groups = ["dev"]

# Household private package index (devpi). explicit = true → only the
# packages pinned to it below resolve here; everything else stays on PyPI.
# On the atlas CI runner uv authenticates ambiently via the vended devpi-read
# netrc (NETRC), a dev machine via ~/.netrc — no per-repo GitHub secret.
# Mirrors radar-hooves/cadmus's backend/pyproject.toml.
[[tool.uv.index]]
name = "godswood"
url = "https://pypi.godswood.au/poodle64/prod/+simple/"
explicit = true

# mcp-common lives INSIDE the mcp-servers repo and is not published to an
# index, so the MCP extra resolves it from the sibling checkout (the
# household no-vendoring pattern — same as ragify/redactyl/milton); its
# source stays scoped to the mcp-common-dev group (see the group comment
# above). redactyl-core is a base dependency now too (the telemetry
# contract's configure() call is needed at every entry point, not only the
# mcp extra), pinned to the index so its floor here is reachable — a
# group-scoped path override is silently inert once a package is also an
# ungrouped dependency (measured on radar-hooves/cadmus).
#
# api-common (the telemetry extra) resolves from the index too: mcp-servers'
# own root pins it there for every consumer, so nothing here inherits a path.
[tool.uv.sources]
mcp-common = { path = "../mcp-servers/mcp-common", editable = true, group = "mcp-common-dev" }
api-common = { index = "godswood" }
redactyl-core = { index = "godswood" }

[tool.hatch.build.targets.sdist]
exclude = [
  "/.claude",
  "/.envrc",
  "/.gitattributes",
  "/.pre-commit-config.yaml",
  "/docs",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/supacrawl"]
