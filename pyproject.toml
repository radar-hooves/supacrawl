 [build-system]
 requires = ["hatchling"]
 build-backend = "hatchling.build"

[project]
name = "supacrawl"
version = "2026.10.2"
 description = "Zero-infrastructure CLI web scraper with LLM extraction."
 readme = "README.md"
 requires-python = ">=3.14"
 license = { text = "MIT" }
authors = [
    {name = "poodle64"}
]
keywords = ["scraper", "crawler", "web", "llm", "markdown", "playwright"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
# Every name here and in every extra resolves from PyPI alone: this package is
# published there, and a name that exists only on a private index would make
# `pip install supacrawl` fail, or install a stranger's package of that name.
dependencies = [
  "beautifulsoup4>=4.14.3",
  "click>=8.3.1",
  "httpx[brotli]>=0.28.1",
  # CVE-2026-111497 (Brotli decoder) is fixed in 1.2.1; every scraped page can reach it.
  "brotli>=1.2.1",
  # Validates LLM extraction output against the caller's JSON schema.
  "jsonschema>=4.26.0",
  "markdownify>=1.2.2",
  "ollama>=0.6.1",
  "pdfplumber>=0.11.9",
  # Transitive via pdfplumber; < 13.0.0 has a crafted-image code-execution flaw.
  "pillow>=13.0.0",
  "playwright>=1.40.0,<2.0.0",  # Keep >=1.40.0 for NixOS — see #79, #104
  "pydantic>=2.12.5",
  "pyyaml>=6.0.3",
  "rich>=14.3.3",
  "tomli-w>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/radar-hooves/supacrawl"
Repository = "https://github.com/radar-hooves/supacrawl"

[dependency-groups]
# The MCP server is built on mcp-common, the household's private MCP framework,
# which is not on PyPI. Dependency groups never reach the published wheel, so
# this is the one place it may be named: local development installs it (with
# api-common, which it carries) to run tests/test_mcp; CI and a PyPI install do
# not, and those tests skip themselves when it is absent.
mcp-dev = [
  "supacrawl[mcp]",
  "mcp-common",
  # mcp-common's own private dependencies, declared so their index pins below
  # apply: under an explicit index a transitive-only name resolves against PyPI.
  "api-common",
  "portcullis-client",
  "redactyl-core",
]
# The field readers the benchmark compares against (`supacrawl bench run --provider`).
bench = [
  "crawl4ai>=0.7",
  "trafilatura>=2.0",
]
dev = [
  "supacrawl[stealth,camoufox,captcha,pdf-ocr,api,readability]",
  "mypy>=1.19.1",
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.15.4",
  "types-PyYAML>=6.0.12.20250915",
]

[project.optional-dependencies]
stealth = [
  "patchright>=1.40.0",  # Keep >=1.40.0 for NixOS — see #79, #104
]
camoufox = [
  # 0.4.11's validate_config() raised UnknownProperty for any config key
  # missing from the fetched browser build's properties.json, so a browser
  # release that drops a property (navigator.appCodeName, v156.0.1-beta.33)
  # breaks every launch. 0.5.6 made that skip-and-log instead of fatal.
  "camoufox[geoip]>=0.5.6",
  # camoufox's bundled Firefox juggler rejects playwright >= 1.61's
  # Browser.setDefaultViewport `isMobile` property ("not described in this
  # scheme"), so any camoufox launch fails at new_page. Lift the ceiling
  # once a camoufox release accepts the 1.61 protocol.
  "playwright<1.61",
]
captcha = [
  "2captcha-python>=2.0.3",
]
pdf-ocr = [
  "pytesseract>=0.3.13",
  "pdf2image>=1.17.0",
]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
]
readability = [
  "readability-lxml>=0.8",
  "rank-bm25>=0.2",
]
mcp = [
  # What the MCP server needs from PyPI. It also needs mcp-common, the
  # household's private framework (see the mcp-dev group), which the deployment
  # that runs `supacrawl-mcp` installs alongside this extra; `supacrawl-mcp`
  # says so when it is missing.
  "anyio>=4.12.1",
  "fastmcp>=3.1.0",
  "pydantic-settings>=2.13.1",
  "python-dotenv>=1.2.2",
  "starlette>=0.52.1",
  # An MCP caller cannot install extras, so the server carries the ones that change
  # what a request does: without these a scrape `query` is silently not applied.
  "readability-lxml>=0.8",
  "rank-bm25>=0.2",
]

[project.scripts]
supacrawl = "supacrawl.cli:app"
supacrawl-mcp = "supacrawl.mcp_launch:main"

[tool.pytest.ini_options]
markers = [
    "unit: Pure logic tests with no I/O, network, or browser",
    "integration: Filesystem-heavy tests, may use local HTTP server and Playwright",
    "e2e: End-to-end tests with live network and Playwright",
    "mcp: MCP server tests (requires supacrawl[mcp])",
    "stealth_smoke: Launches each stealth engine headless (#145); dedicated CI job only",
    "browser: Drives a real Chromium; skipped where Playwright's Chromium is not installed",
]
# The documented quality gate; a later -m on the command line overrides it, so
# `pytest -m e2e` and `pytest -m stealth_smoke` still select theirs.
addopts = '-m "not e2e and not stealth_smoke"'
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:The 'text' argument to find\\(\\)-type methods is deprecated:DeprecationWarning:bs4.element",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "fpdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "twocaptcha.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "camoufox.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdfplumber.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytesseract.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdf2image.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncssh.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "readability.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rank_bm25.*"
ignore_missing_imports = true

# The MCP-surface packages (mcp-dev group) are absent on CI and under a PyPI
# install; the benchmark's field readers (bench group) likewise.
[[tool.mypy.overrides]]
module = ["fastmcp.*", "mcp.*", "mcp_common.*", "api_common.*", "pydantic_settings.*", "trafilatura.*", "crawl4ai.*"]
ignore_missing_imports = true

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

# dev only: `uv run` syncs the default groups wherever it runs, CI included.
# Local dev installs every group via .envrc (`uv sync --all-groups`).
default-groups = ["dev"]

# The household's private package index, used by the mcp-dev group alone
# (explicit = true: only the names pinned below resolve here). Nothing in
# [project] or any extra resolves from it.
[[tool.uv.index]]
name = "godswood"
url = "https://pypi.godswood.au/poodle64/prod/+simple/"
explicit = true

[tool.uv.sources]
mcp-common = { index = "godswood" }
portcullis-client = { index = "godswood" }
api-common = { index = "godswood" }
redactyl-core = { index = "godswood" }

[tool.hatch.build.targets.sdist]
exclude = [
  "/.claude",
  "/.envrc",
  "/.gitattributes",
  "/.pre-commit-config.yaml",
  "/docs",
  "/tests",
]

[tool.change]
publish = "wheels"

[tool.hatch.build.targets.wheel]
packages = ["src/supacrawl"]
