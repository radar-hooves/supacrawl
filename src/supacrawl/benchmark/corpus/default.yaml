name: default
description: >-
  Curated scrape-quality corpus spanning static HTML through JavaScript-heavy single-page apps, structured-data commerce, data tables, PDFs, anti-bot, long reference pages, news and non-Latin/RTL pages, plus a handful of web-search queries. URLs favour frozen targets (purpose-built sandboxes, Wikipedia permalink revisions, immutable arXiv PDFs) so that score changes over time reflect supacrawl changes rather than the web shifting underneath. Volatile targets are marked stable=false and excluded from the regression index; they exist to probe the capability ceiling.

# A hit is any of the top five results on one of the expected domains.
queries:
  - id: q-python-json
    query: python json module documentation
    why: A documentation lookup an agent makes daily.
    expect_domains: [docs.python.org]
  - id: q-renovate-vulnerability-alerts
    query: renovate vulnerabilityAlerts configuration option
    why: An identifier query; the answer is one page of a large reference site.
    expect_domains: [docs.renovatebot.com]
  - id: q-ato-working-from-home
    query: ATO working from home expenses deduction
    why: A government guidance query with one authoritative source.
    expect_domains: [ato.gov.au]
  - id: q-playwright-python-install
    query: playwright python install chromium
    why: A tooling how-to with an official docs page.
    expect_domains: [playwright.dev]
  - id: q-attention-paper
    query: Attention Is All You Need paper arxiv
    why: A named paper; the canonical copy is on arXiv.
    expect_domains: [arxiv.org]

cases:
  # --- Static / baseline -------------------------------------------------
  - id: static-example
    url: https://example.com/
    category: static
    title: IANA example domain
    why: Irreducible baseline; if this is not clean, nothing will be. IANA rewrote the body in 2025, so the anchors are its current sentences.
    difficulty: 1
    probes: [baseline]
    expect: ['for use in documentation examples', 'without needing permission']

  - id: static-sandbox-simple
    url: https://www.scrapethissite.com/pages/simple/
    category: static
    title: ScrapeThisSite simple country list
    why: Static server-rendered list; tests faithful capture of repeated items.
    difficulty: 1
    probes: [static_list]
    expect: ['Andorra', 'Afghanistan']
    expect_absent: ['Sandbox', 'Lessons', 'FAQ']

  # --- Content article / news chrome ------------------------------------
  - id: article-wikipedia-en
    url: https://en.wikipedia.org/w/index.php?title=Web_scraping&oldid=1358788600
    category: article
    title: Wikipedia "Web scraping" (frozen revision)
    why: Heavy nav/sidebar chrome around real prose; the classic main-content test.
    difficulty: 2
    probes: [main_content, boilerplate_removal]
    expect: ['Web scraping', 'data scraping', 'HTTP']
    expect_absent: ['Jump to content', 'Create account', 'Privacy policy', 'What links here']

  - id: article-gutenberg-text
    url: https://www.gutenberg.org/cache/epub/84/pg84.txt
    category: article
    title: Project Gutenberg Frankenstein (plain text)
    why: Long plain-text body; tests that prose survives without mangling.
    difficulty: 1
    probes: [long_text]
    expect: ['Frankenstein', 'Walton']

  # --- Documentation -----------------------------------------------------
  - id: docs-python-json
    url: https://docs.python.org/3.12/library/json.html
    category: docs
    title: Python docs — json module
    why: Code blocks, definition lists and tables; tests structure preservation.
    difficulty: 2
    probes: [code_blocks, tables]
    expect: ['json.dumps', 'Serialize', 'object_hook']
    expect_absent: ['Navigation', 'Quick search', 'previous |']

  # --- E-commerce static + structured data ------------------------------
  - id: ecommerce-books-static
    url: https://books.toscrape.com/
    category: ecommerce
    title: Books to Scrape catalogue
    why: Purpose-built static shop; pagination and product grid, no schema markup.
    difficulty: 1
    probes: [product_grid]
    expect: ['A Light in the Attic', '£']

  - id: ecommerce-scrapeme-jsonld
    url: https://scrapeme.live/shop/Bulbasaur/
    category: ecommerce
    title: ScrapeMe WooCommerce product (JSON-LD)
    why: Real WooCommerce Product/Offer JSON-LD; tests structured-data harvest.
    difficulty: 2
    probes: [structured_data, json_ld]
    expect: ['Bulbasaur']

  - id: ecommerce-webscrapingdev-product
    url: https://web-scraping.dev/product/1
    category: ecommerce
    title: web-scraping.dev product 1 (JSON-LD + hidden JSON)
    why: ScrapFly sandbox product with embedded JSON-LD and hidden state.
    difficulty: 2
    probes: [structured_data, json_ld]
    expect: ['Box of Chocolate Candy']

  # --- JavaScript-rendered / SPA ----------------------------------------
  - id: spa-quotes-js
    url: https://quotes.toscrape.com/js/
    category: spa
    title: Quotes to Scrape (JavaScript build)
    why: Quotes exist only in a JS array; bare HTTP sees nothing — proves rendering.
    difficulty: 3
    js_heavy: true
    spa: true
    probes: [js_render]
    expect: ['Albert Einstein', 'world as we have created it']

  - id: spa-ajax-javascript
    url: https://www.scrapethissite.com/pages/ajax-javascript/
    category: spa
    title: ScrapeThisSite AJAX/JavaScript Oscars table
    why: Table populated by AJAX after load; tests wait-for-content behaviour.
    difficulty: 3
    js_heavy: true
    probes: [js_render, ajax]
    expect: ['2015', 'Spotlight']

  # --- Infinite scroll / lazy load --------------------------------------
  - id: infinite-quotes-scroll
    url: https://quotes.toscrape.com/scroll
    category: infinite_scroll
    title: Quotes to Scrape (infinite scroll)
    why: Content loads on scroll; measures how much a single render captures.
    difficulty: 3
    js_heavy: true
    probes: [infinite_scroll]
    expect: ['Albert Einstein']

  # --- Data tables -------------------------------------------------------
  - id: tables-wikipedia-gdp
    url: https://en.wikipedia.org/w/index.php?title=List_of_countries_by_GDP_(nominal)&oldid=1358330458
    category: tables
    title: Wikipedia GDP (nominal) tables (frozen revision)
    why: Several large data tables; tests markdown table fidelity.
    difficulty: 3
    probes: [tables]
    expect: ['United States', 'Gross domestic product']

  # --- PDF ---------------------------------------------------------------
  - id: pdf-arxiv-attention
    url: https://arxiv.org/pdf/1706.03762
    category: pdf
    title: 'arXiv: Attention Is All You Need (PDF)'
    why: >-
      Immutable academic PDF; tests PDF text extraction quality. LaTeX PDFs are the canonical trigger for the inter-word spacing defect, so this case also guards word_spacing (fused-word runs would tank the score).


    difficulty: 3
    content_type: pdf
    probes: [pdf, word_spacing]
    expect: ['Attention Is All You Need', 'Transformer', 'multi-head']

  # --- Internationalisation / RTL ---------------------------------------
  - id: i18n-ja-wikipedia
    url: https://ja.wikipedia.org/wiki/ウェブスクレイピング
    category: i18n
    title: Japanese Wikipedia — web scraping
    why: CJK content; tests encoding and that completeness survives non-Latin text.
    difficulty: 2
    probes: [i18n_cjk]
    expect: ['ウェブスクレイピング']

  - id: i18n-ar-wikipedia
    url: https://ar.wikipedia.org/wiki/تنقيب_الويب
    category: i18n
    title: Arabic Wikipedia — web scraping (RTL)
    why: Right-to-left script; tests RTL handling and ordering.
    difficulty: 2
    probes: [i18n_rtl]
    expect: ['تنقيب']

  # --- Anti-bot ----------------------------------------------------------
  - id: antibot-webscrapingdev-easy
    url: https://web-scraping.dev/antibot/easy
    category: antibot
    title: web-scraping.dev easy anti-bot
    why: >-
      Anti-bot capability probe. The endpoint returns HTTP 403 to the full escalation ladder (playwright→patchright→camoufox→camoufox+HTTP/1.1), camoufox included, while a benign path on the same host (web-scraping.dev/ products) scrapes cleanly — so it is a genuine evasion ceiling, not IP throttle. Kept as a probe (the bot_challenge verdict + honest failure are the signal we want), not a regression-index case, so an unbeatable wall does not permanently drag the headline. Re-evaluate if a tier-4 engine lands. Same class as antibot-live-g2.

    difficulty: 4
    antibot: true
    stable: false
    probes: [antibot]

  - id: antibot-live-g2
    url: https://www.g2.com/categories/web-scraping
    category: antibot
    title: G2 category (live Cloudflare)
    why: Live commercial anti-bot; capability ceiling probe, not regression signal.
    difficulty: 5
    antibot: true
    stable: false
    probes: [antibot, cloudflare]

  # --- Government / tax law / RAG ----------------------------------------
  # The operator's headline use case: harvesting Australian tax law into a RAG
  # collection. These probe gov-CMS HTML (tables + prose) and a frozen gov PDF.
  # They remain scored=false (capability probes, not regression index).
  #
  # Decision rationale (re-evaluated after reference.py hydration-settle
  # hardening in #134): the reference renderer now polls the main-content
  # container until its text length stabilises across two consecutive reads
  # (bounded by a 5 s settle window) before extracting — which in principle
  # should capture JS-hydrated content rather than the pre-hydration shell.
  # However, the ATO CMS sits behind Akamai bot protection that drops
  # vanilla headless Chromium to a 15-word shell regardless of how long we
  # wait: the shell is what Akamai serves to unrecognised browsers, not a
  # timing gap.  The settle wait is insufficient for bot-gated pages; the
  # fix would require anti-bot escalation in the reference renderer (outside
  # #134 scope).  Until a live bench confirms the renderer captures the real
  # page, flipping these to scored would silently set a misleading baseline.
  # Keeping scored=false is the conservative, honest call.
  #
  # What CAN be scored here: expect_hit (anchors), structure metrics
  # (tables, headings), and word_spacing.  A regression collapses those.
  # To re-score: run a live bench after adding anti-bot escalation to the
  # reference renderer and confirm reference_words > 500 for both cases.
  - id: gov-ato-tax-rates
    url: https://www.ato.gov.au/tax-rates-and-codes/tax-rates-australian-residents
    category: gov
    title: ATO resident tax rates (gov CMS, bracket tables)
    why: >-
      Australian Taxation Office guidance on a JS-rendered government CMS; the income-tax bracket tables must survive as markdown tables for RAG. The anchors are legislated values (the $18,200 tax-free threshold) rather than the year's marginal rate, so they stay valid across annual updates.


    difficulty: 3
    js_heavy: true
    scored: false
    probes: [gov, tables, main_content, rag]
    expect: ['Resident tax rates', 'taxable income', '18,200']
    expect_absent: ['Skip to', 'Back to top']

  - id: gov-ato-wfh
    url: https://www.ato.gov.au/individuals-and-families/income-deductions-offsets-and-records/deductions-you-can-claim/working-from-home-expenses
    category: gov
    title: ATO working-from-home deductions (gov CMS, prose)
    why: >-
      Long-form government guidance prose; tests main-content extraction on the same gov CMS without tables. A collapse toward the Next.js shell (near-zero words) catches a JS-shell-escalation regression.


    difficulty: 3
    js_heavy: true
    scored: false
    probes: [gov, main_content, rag]
    expect: ['Working from home expenses', 'running expenses', 'deduction']
    expect_absent: ['Skip to', 'Back to top']

  - id: gov-ato-pdf-depreciation
    url: https://www.ato.gov.au/api/public/content/a20e2f4ec8c041358a1885531785c8a0?v=62e5fe6a
    category: gov
    title: ATO Guide to depreciating assets 2025 (gov PDF)
    why: >-
      A versioned-immutable government PDF (NAT 1996-06.2025) reached through an extensionless content-API URL — exercises both content-type/magic-byte PDF detection and the word_spacing guard on a digitally-generated gov PDF, the exact shape of the operator's tax-law RAG sources.


    difficulty: 3
    content_type: pdf
    scored: false
    probes: [pdf, word_spacing, gov, rag, tables]
    expect: ['Guide to depreciating assets', 'decline in value', 'NAT 1996', 'assessable income']

  # --- Real-world operator use cases (retail, big-site JS) ---------------
  - id: ecommerce-petcircle-au
    url: https://www.petcircle.com.au/discover/best-dog-food-for-sensitive-stomachs
    category: ecommerce
    title: Pet Circle dog-food guide (AU retailer, JSON-LD Article)
    why: >-
      The operator's pet-food research use case on a live Australian retailer; evergreen editorial with embedded JSON-LD Article. Tests main-content extraction plus deterministic structured-data harvest on a real commercial site (not a sandbox).


    difficulty: 2
    probes: [structured_data, json_ld, main_content]
    expect: ['dog', 'food', 'sensitive', 'Dr Michelle Wong']

  - id: docs-github-readme
    url: https://github.com/microsoft/playwright
    category: docs
    title: GitHub repo README (JS-rendered, microdata)
    why: >-
      A large JS-rendered application shell whose README only appears after the static HTML hydrates; tests the JS-shell escalation on a mainstream site and microdata (SoftwareSourceCode) harvest.


    difficulty: 2
    js_heavy: true
    probes: [js_render, structured_data, microdata]
    expect: ['Playwright', 'web automation']
    expect_absent: ['Skip to content']

  # --- Long reference page -----------------------------------------------
  - id: docs-renovate-config-options
    url: https://docs.renovatebot.com/configuration-options/
    category: docs
    title: Renovate configuration options (one very long reference page)
    why: >-
      About 300,000 characters of markdown, 180 option sections with tables; the page behind the extract and
      query-filter retrieval work. Tests that a very long page comes back whole and quickly.
    difficulty: 3
    probes: [long_page, tables, docs]
    expect: ['vulnerabilityAlerts', 'minimumReleaseAgeBehaviour', 'timestamp-required']
    expect_absent: ['Skip to content', 'Table of contents']

  - id: docs-mdn-fetch
    url: https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch
    category: docs
    title: MDN — Using the Fetch API
    why: A mainstream documentation site with heavy sidebar and footer chrome around code-rich prose.
    difficulty: 2
    probes: [code_blocks, main_content, boilerplate_removal]
    expect: ['fetch()', 'Response', 'await']
    expect_absent: ['Skip to main content', 'MDN Plus']

  - id: docs-uv
    url: https://docs.astral.sh/uv/
    category: docs
    title: uv documentation landing page (mkdocs-material)
    why: A docs landing page whose navigation outweighs its body; tests that the body is what survives.
    difficulty: 2
    probes: [main_content, boilerplate_removal]
    expect: ['uv', 'pip']
    expect_absent: ['Skip to content']

  # --- News ----------------------------------------------------------------
  - id: news-abc-brainwaves
    url: https://www.abc.net.au/news/2025-06-16/mind-reading-ai-brain-computer-interface/105376164
    category: news
    title: ABC News article (JS-rendered news CMS)
    why: A published news article on a JS-heavy CMS with related-story rails and a site header; the prose must survive, the rails must not.
    difficulty: 3
    js_heavy: true
    probes: [news, main_content, boilerplate_removal]
    expect: ['brainwaves', 'Sydney']
    expect_absent: ['Skip to main content', 'Top Stories']

  # --- JS-rendered applications -------------------------------------------
  - id: spa-react-docs
    url: https://react.dev/learn
    category: spa
    title: react.dev Quick Start (React application shell)
    why: A documentation site that is itself a React app; server-rendered, hydrated on load.
    difficulty: 2
    js_heavy: true
    spa: true
    probes: [js_render, code_blocks]
    expect: ['Quick Start', 'component']

  - id: forum-hn-item-1
    url: https://news.ycombinator.com/item?id=1
    category: forum
    title: Hacker News item 1 (frozen thread)
    why: The oldest HN thread; a static table-layout forum page whose comments must come through in order.
    difficulty: 1
    probes: [static_list, forum]
    expect: ['Y Combinator']

  - id: forum-stackoverflow-yield
    url: https://stackoverflow.com/questions/231767/what-does-the-yield-keyword-do-in-python
    category: forum
    title: Stack Overflow question (cookie banner, bot protection)
    why: A high-traffic Q&A page behind Cloudflare with a cookie consent banner; tests the banner goes and the answer stays. Live protection, so a probe.
    difficulty: 3
    antibot: true
    stable: false
    probes: [antibot, cookie_banner, code_blocks]
    expect: ['yield', 'generator']
    expect_absent: ['Accept all cookies']

  # --- Package registries ------------------------------------------------
  - id: registry-pypi-httpx
    url: https://pypi.org/project/httpx/
    category: docs
    title: PyPI project page — httpx
    why: A registry page whose README body sits inside a dense sidebar of metadata and navigation.
    difficulty: 2
    probes: [main_content, boilerplate_removal]
    expect: ['httpx', 'pip install httpx']
    expect_absent: ['Skip to main content']

  - id: registry-npm-express
    url: https://www.npmjs.com/package/express
    category: docs
    title: npm package page — express
    why: A server-rendered React registry page; the README must survive the install sidebar and header.
    difficulty: 2
    js_heavy: true
    probes: [main_content, js_render]
    expect: ['express', 'npm i express']

  # --- Bot-walled and app-shell probes -------------------------------------
  - id: antibot-reddit-old
    url: https://old.reddit.com/r/Python/
    category: antibot
    title: old.reddit.com subreddit listing (live bot wall)
    why: Reddit refuses most automated clients; a probe of whether any rung of the ladder gets a listing.
    difficulty: 4
    antibot: true
    stable: false
    probes: [antibot]
    expect: ['Python']

  - id: spa-youtube-watch
    url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
    category: spa
    title: YouTube watch page (app shell)
    why: A pure application shell whose useful text (title, description) arrives by script; a capability probe, not regression signal.
    difficulty: 4
    js_heavy: true
    spa: true
    stable: false
    probes: [js_render, app_shell]
    expect: ['Rick Astley']
